<div class="modal-header"><button type="button" class="close" ng-click="close()">&times;</button><h3 class="modal-title">Vault</h3></div>
<div class="modal-body">
  <div class="alert alert-danger" ng-if="error">{{error}}</div>
  <div class="form-group"><label>Prefix</label><input class="form-control" ng-model="data.prefix"></div>
  <div class="form-group"><label>Name</label><input class="form-control" ng-model="data.name" placeholder="env"></div>
  <div class="form-group" ng-if="data.name === 'env'"><label>Environment Variable Prefix</label><input class="form-control" ng-model="data.config.prefix"></div>
  <div class="form-group" ng-if="data.name !== 'env'"><label>Backend Config (JSON)</label><textarea class="form-control" rows="5" ng-model="configJson"></textarea><p class="help-block">Backend-specific fields from Kong's vault schema.</p></div>
  <div class="form-group"><label>Description</label><textarea class="form-control" ng-model="data.description"></textarea></div>
  <div class="form-group"><label>Tags</label><input class="form-control" ng-list="," ng-model="data.tags"></div>
</div>
<div class="modal-footer"><button class="btn btn-default" ng-click="close()">Cancel</button><button class="btn btn-primary" ng-click="submit()">Save</button></div>
