<div class="modal-header"><button type="button" class="close" ng-click="close()">&times;</button><h3 class="modal-title">Key Set</h3></div><div class="modal-body"><div class="alert alert-danger" ng-if="error">{{error}}</div><div class="form-group"><label>Name (optional)</label><input class="form-control" ng-model="data.name"></div><div class="form-group"><label>Tags</label><input class="form-control" placeholder="Comma-separated tags" ng-list="," ng-model="data.tags"></div></div><div class="modal-footer"><button class="btn btn-default" ng-click="close()">Cancel</button><button class="btn btn-primary" ng-click="submit()">Save</button></div>
