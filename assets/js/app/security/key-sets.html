<div class="row actions"><div class="col-md-12"><button class="btn btn-primary" ng-click="add()"><i class="mdi mdi-plus"></i> Add Key Set</button><button class="btn btn-default" style="margin-left:8px" ui-sref="keys">Keys</button><button class="btn btn-default" style="margin-left:8px" ui-sref="vaults">Vaults</button><list-search class="pull-right" data-filters="filters" data-options="itemsPerPageOptions" data-items="itemsPerPage"></list-search></div></div>
<div class="row"><div class="col-md-12"><table class="table table-striped"><tr><th>ID</th><th>Name</th><th>Tags</th><th></th></tr><tr dir-paginate="item in items.data | filter:filters.searchWord | itemsPerPage:itemsPerPage"><td>{{item.id}}</td><td>{{item.name || '-'}}</td><td><span class="badge badge-tag" ng-repeat="tag in item.tags">{{tag}}</span></td><td><button class="btn btn-danger btn-link" ng-click="remove($index,item)"><i class="mdi mdi-delete"></i> Delete</button></td></tr><tr ng-if="!items.data.length && !loading"><td colspan="4" class="text-center text-muted">No key sets found.</td></tr></table><dir-pagination-controls class="pull-right"></dir-pagination-controls></div></div>
