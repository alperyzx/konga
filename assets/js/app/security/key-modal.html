<div class="modal-header"><button type="button" class="close" ng-click="close()">&times;</button><h3 class="modal-title">Key</h3></div>
<div class="modal-body">
  <div class="alert alert-danger" ng-if="error">{{error}}</div>
  <div class="form-group"><label>Name</label><input class="form-control" ng-model="data.name"></div>
  <div class="form-group"><label>Key ID (kid)</label><input class="form-control" ng-model="data.kid"></div>
  <div class="form-group"><label>Key Set</label><select class="form-control" ng-model="data.set" ng-options="s.id as (s.name || s.id) for s in keySets"><option value="">No key set</option></select></div>
  <div class="form-group"><label>Format</label><select class="form-control" ng-model="data.mode"><option value="jwk">JWK</option><option value="pem">PEM</option></select></div>
  <div class="form-group" ng-if="data.mode === 'jwk'"><label>JWK (JSON)</label><textarea class="form-control" rows="5" ng-model="data.jwk"></textarea></div>
  <div ng-if="data.mode === 'pem'"><div class="form-group"><label>Public key</label><textarea class="form-control" rows="4" ng-model="data.pem.public_key"></textarea></div><div class="form-group"><label>Private key</label><textarea class="form-control" rows="4" ng-model="data.pem.private_key"></textarea></div></div>
  <div class="form-group"><label>Tags</label><input class="form-control" ng-list="," ng-model="data.tags"></div>
</div>
<div class="modal-footer"><button class="btn btn-default" ng-click="close()">Cancel</button><button class="btn btn-primary" ng-click="submit()">Save</button></div>
