<div class="row actions"><div class="col-md-12"><button class="btn btn-primary" ng-click="add()"><i class="mdi mdi-plus"></i> Add Vault</button><button class="btn btn-default" style="margin-left:8px" ui-sref="key-sets">Keys</button><list-search class="pull-right" data-filters="filters" data-options="itemsPerPageOptions" data-items="itemsPerPage"></list-search></div></div><div class="alert alert-info">Vault configuration fields depend on the configured Kong vault backend. This page manages the common metadata exposed by Kong.</div>
<div class="row"><div class="col-md-12"><table class="table table-striped"><tr><th>Prefix</th><th>Name</th><th>Description</th><th>Tags</th><th></th></tr><tr dir-paginate="item in items.data | filter:filters.searchWord | itemsPerPage:itemsPerPage"><td><code>{{item.prefix}}</code></td><td>{{item.name}}</td><td>{{item.description || '-'}}</td><td><span class="badge badge-tag" ng-repeat="tag in item.tags">{{tag}}</span></td><td><button class="btn btn-danger btn-link" ng-click="remove($index,item)"><i class="mdi mdi-delete"></i> Delete</button></td></tr><tr ng-if="!items.data.length && !loading"><td colspan="5" class="text-center text-muted">No vaults found.</td></tr></table><dir-pagination-controls class="pull-right"></dir-pagination-controls></div></div>
