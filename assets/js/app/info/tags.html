<div class="row">
    <div class="col-md-12">
        <div class="row actions">
            <div class="col-md-12">
                <input type="text" class="form-control" ng-model="filters.searchWord"
                       placeholder="Search tags, entities, or IDs...">
            </div>
        </div>

        <div class="alert alert-danger" ng-if="error">{{error}}</div>
        <konga-loader ng-if="loading"></konga-loader>

        <div class="table-responsive" ng-if="!loading">
            <table class="table table-striped table-hover">
                <thead>
                    <tr><th>Tag</th><th>Entity</th><th>Entity ID</th></tr>
                </thead>
                <tbody>
                    <tr ng-repeat="item in tags | filter:filters.searchWord">
                        <td><span class="badge badge-tag badge-success badge-inverse"><i class="mdi mdi-tag"></i>&nbsp;{{item.tag}}</span></td>
                        <td>{{item.entity_name}}</td>
                        <td><code>{{item.entity_id}}</code></td>
                    </tr>
                    <tr ng-if="!(tags | filter:filters.searchWord).length">
                        <td colspan="3" class="text-center text-muted"><em>No tags found...</em></td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
